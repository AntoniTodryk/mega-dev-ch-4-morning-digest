# Plan morning-digest § 3/§ 4 (ADR 0003): the preview is built here and deployed to GitHub
# Pages as an artifact. It is never committed. The marker comes from the repository variable
# LANE_MARKER; delete the variable and run this again to publish the same page without it.
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 as index.html
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
        run: scripts/save-preview.sh /digest/2026-10-28 _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
